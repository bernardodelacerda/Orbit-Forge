    ['CubeSat (NASA CSLI)','CubeSat flight-certified and deployed as a relay',r(ST.cube,1)]];
  const it=A.filter(x=>x.length>1),g=it.filter(x=>x[2]=='G').length,pc=Math.round(g/it.length*100),ok=pc>=80;ST.cmlok=ok;
  return `<details class="cmlck"><summary>📋 JPL CML checklist · ${pc}% green → ${ok?'<b class="ok">concept at CML 7 ✓</b>':'<b class="bad">below the 80% target</b>'}</summary><table class="req"><tr><th>Functional area</th><th>Criteria</th><th>Status (RYG)</th></tr>${A.map(x=>x.length==1?`<tr><th colspan="3" style="text-align:center">${x[0]}</th></tr>`:`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="dot ${x[2]}"></span>${x[2]}</td></tr>`).join('')}</table><small>G = completed · Y = in progress · R = not started. Laid out like JPL’s CML 4 Checklist Sheet. 📄 JPL: the checklist measures completeness, not quality, and self-assessments tend to be too optimistic, so an independent assessor should score it. Here, the game scored it.</small></details>`;}
/* ---------- efeitos sonoros ---------- */
let NW=null;
function sfx(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,V=OPT.vol;
  if(!NW){NW=AC.createBuffer(1,AC.sampleRate*2|0,AC.sampleRate);const d=NW.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const osc=(f,ty,a,d,v,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t+a);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
    g.gain.setValueAtTime(0,t+a);g.gain.linearRampToValueAtTime(v*V,t+a+.015);g.gain.exponentialRampToValueAtTime(.0008,t+a+d);o.connect(g);g.connect(AC.destination);o.start(t+a);o.stop(t+a+d+.05);};
  const nz=(d,f,ty,v,a)=>{a=a||.01;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NW;s.loop=true;fl.type=ty;fl.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*V,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.05);};
  if(k=='pick'){osc(660,'sine',0,.25,.22);osc(990,'sine',.09,.35,.2);osc(1320,'sine',.18,.5,.16);}
  else if(k=='ok'){osc(880,'sine',0,.18,.2);osc(1320,'sine',.08,.28,.16);}
  else if(k=='bad'){osc(180,'square',0,.35,.1,110);}
  else if(k=='thud'){osc(90,'sine',0,.25,.35,45);nz(.15,400,'lowpass',.2);}
  else if(k=='clank'){osc(320,'triangle',0,.4,.2,200);osc(640,'triangle',.02,.3,.1);nz(.12,1800,'bandpass',.18);}
  else if(k=='chute'){nz(1.3,700,'bandpass',.35,.3);}
  else if(k=='splash'){nz(1.8,900,'lowpass',.6);osc(70,'sine',0,.6,.35,40);}
  else if(k=='breath'){nz(1.1,650,'bandpass',.16,.45);}
  else if(k=='heart'){osc(55,'sine',0,.18,.5,40);osc(55,'sine',.22,.18,.4,40);}
  else if(k=='alarm'){for(let i=0;i<4;i++)osc(i%2?660:880,'square',i*.22,.18,.07);}
  else if(k=='boom'){nz(1.2,300,'lowpass',.7);osc(60,'sine',0,.8,.5,30);}
  else if(k=='rumble'){nz(9,140,'lowpass',.9,.5);osc(38,'sawtooth',0,6,.12,30);}
}catch(e){}}
/* ---------- Terra com continentes e nuvens (textura gerada) ---------- */
let ETX=null;
function earthTex(){if(ETX)return ETX;const W=256,H=128,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),im=g.createImageData(W,H);
  const vn=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),u0=x-ix,v0=y-iy,s=q=>q*q*(3-2*q),a=hsh(ix,iy),b=hsh(ix+1,iy),c2=hsh(ix,iy+1),d=hsh(ix+1,iy+1),u=s(u0),v=s(v0);return a+(b-a)*u+(c2-a)*v+(a-b-c2+d)*u*v;};
  const fb=(x,y)=>{let v=0,a=.5,f=1;for(let o=0;o<5;o++){v+=a*vn(x*f,y*f);a*=.5;f*=2;}return v;};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,lat=Math.abs(y/H-.5)*2,n=fb(x/30,y/30),cl=fb(x/14+40,y/14+9);let r,gg,b;
    if(n>.53){const m=(n-.53)*4;r=60+m*80;gg=105+m*35;b=45+m*25;if(lat<.4&&n>.6){r=185;gg=160;b=105;}}else{r=18;gg=55+n*60;b=135+n*95;}
    if(lat>.84){r=gg=b=236;}
    if(cl>.57){const k=Math.min(1,(cl-.57)*5);r+=(255-r)*k;gg+=(255-gg)*k;b+=(255-b)*k;}
    im.data[i]=r;im.data[i+1]=gg;im.data[i+2]=b;im.data[i+3]=255;}
  g.putImageData(im,0,0);ETX=new THREE.CanvasTexture(c);return ETX;}
/* ---------- estatísticas da missão ---------- */
let ST={t0:performance.now(),dist:0,ref:0,steps:0,jumps:0,wrong:0,fails:0,samples:0,rover:0,hits:0,showers:0,bio:0,po:0,trade:'',feas:0,cmlok:0,cube:0,cubeB:0};
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function statsHTML(){const s=Math.round((performance.now()-ST.t0)/1000);let best=0,rec=false;
  try{best=+localStorage.getItem('orbitforge_best')||0;if(!best||s<best){localStorage.setItem('orbitforge_best',s);rec=true;}}catch(e){}
  const err=ST.wrong+ST.fails,st=err<=1&&s<720?3:err<=4?2:1;
  return `<div class="stats"><div><b>${fmtT(s)}</b><small>Mission time</small></div><div><b>${Math.round(ST.dist)} m</b><small>Walked on the Moon</small></div><div><b>${ST.steps}</b><small>Footprints left</small></div><div><b>${ST.ref}</b><small>O₂ refills</small></div><div><b>${ST.jumps}</b><small>Moon jumps</small></div><div><b>${err}</b><small>Mistakes</small></div><div><b>${ST.samples}/8</b><small>Rock samples</small></div><div><b>${Math.round(ST.rover)} m</b><small>Rover driving</small></div><div><b>${ST.hits}</b><small>Meteoroid hits</small></div></div><p>Rating: <span class="stars">${'★'.repeat(st)+'☆'.repeat(3-st)}</span> ${rec?'· <b class="ok">New record!</b>':'· Best time: '+fmtT(best)}</p>${cmlChecklist()}<p class="useg"><b>📦 User segment:</b> your ${ST.samples} rock sample${ST.samples==1?'':'s'} go to scientists on Earth${ST.bio?', and the frozen BioNutrients-2 packs follow NASA’s steps: 1 Delivery → 2 Thaw → 3 Empty & wash → 4 Centrifuge → 5 Analyze':''}. The results become published science! 📄</p><div class="ach">${[['🛰 CubeSat developer','Certify a CubeSat and deploy it as a relay',ST.cube],['📐 Mission architect','Reach CML 7 with 80% of the JPL checklist green',ST.cmlok],['🧫 Space biologist','Complete the BioNutrients-2 experiment',ST.bio],['🪨 Geologist','Collect all 8 rock samples',ST.samples>=8],['👣 Moonwalker','Walk 1,000 m on the Moon',ST.dist>=1000],['🦘 Kangaroo','Jump 20 times',ST.jumps>=20],['🚙 Rover driver','Drive the rover 500 m',ST.rover>=500],['☄ Dodger','Get through a meteoroid shower without a hit',ST.showers>0&&ST.hits==0],['🎯 Flawless','Make no mistakes',err==0],['⏱ Speedrunner','Finish in under 10 minutes',s<600]].map(a=>`<span class="${a[2]?'on':''}" title="${a[1]}">${a[0]}</span>`).join('')}</div>`;}
/* ---------- 3b. Decolagem da Lua ---------- */
function liftoff(){
  o2=100;setO2(100);factCtx('rocket');phase(6,'Launch segment');cml(7);
  show('Lunar liftoff','',`<div class='ov'><b>Lunar ascent</b><br><span id='lc'>Countdown…</span></div>`);
  moon();base();
  const r=rocket(),y0=.15+.3*.55;r.scale.setScalar(.55);r.position.set(PADX,y0,PADZ);S.add(r);
  const fl=new THREE.Mesh(new THREE.ConeGeometry(.55,3.5,8),new THREE.MeshBasicMaterial({color:0xffb040}));fl.rotation.x=Math.PI;fl.position.y=-1.75;fl.visible=false;r.add(fl);
  const lt=new THREE.PointLight(0xffa040,0,40);lt.position.y=-1;r.add(lt);
  const sm=smoke();sm.position.set(PADX,0,PADZ);S.add(sm);
  const IGN=5.2,t0=T;let l0=0,rum=0;
  say('<b>[NASA · HOUSTON]</b> Orbit Forge, you are GO for lunar liftoff.<span class="fact">🛰 NASA data: leaving the Moon takes only about 2.4 km/s, versus 11.2 km/s to leave Earth. Apollo’s lunar module climbed back to orbit with a single 15.6 kN engine.</span>');
  tick3=t=>{const k=t-t0,dt=l0?Math.min(.05,t-l0):0;l0=t;const lc=$('#lc');
    if(lc)lc.textContent=k<IGN?'T-minus '+Math.max(1,Math.ceil(IGN-k)):'Liftoff!';
    const ign=k>IGN,lift=Math.max(0,k-IGN-.6);
    if(ign&&!rum){rum=1;sfx('rumble');say('<b>[YOU]</b> Goodbye, Moon… I’m going home!');}
    fl.visible=ign;fl.scale.set(1+.12*Math.sin(t*50),1+.25*Math.sin(t*37),1);lt.intensity=ign?3:0;
    r.position.y=y0+lift*lift*1.8;sm.userData.up(ign&&lift<3,.3,dt);
    const sh=ign&&lift<2?.06:0,ry=r.position.y;
    cam.position.set(PADX+14+Math.sin(t*60)*sh,3+Math.min(ry*.6,60),PADZ+16);cam.lookAt(PADX,2.5+ry*.85,PADZ);
    if(k>IGN+7.5){const f=Math.min(1,(k-IGN-7.5)/1.2);cv.style.filter=`brightness(${1-f})`;if(f>=1&&!fx.go){fx.go=1;reentry();}}};
}
